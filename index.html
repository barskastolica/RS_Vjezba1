<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zadaci</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#e9eef5; --surface:#ffffff; --ink:#14213d; --muted:#5b6b86;
  --line:#d3dbe8; --accent:#2554d8; --accent-ink:#ffffff; --done:#8a97ad; --danger:#b3261e;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1626; --surface:#18223a; --ink:#e8eefc; --muted:#9aa8c5;
    --line:#2b3857; --accent:#6f93ff; --accent-ink:#0f1626; --done:#6d7b99; --danger:#ff8a80;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1626; --surface:#18223a; --ink:#e8eefc; --muted:#9aa8c5;
  --line:#2b3857; --accent:#6f93ff; --accent-ink:#0f1626; --done:#6d7b99; --danger:#ff8a80;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.5;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:40px 20px 64px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{margin:0;font-size:clamp(2.6rem,9vw,3.6rem);line-height:1;font-weight:800;letter-spacing:-.03em}
.count{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;
  padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.add{display:flex;gap:8px;margin-bottom:20px}
.add input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:14px 16px;color:var(--ink);
  background:var(--surface);border:2px solid var(--line);border-radius:14px}
.add input::placeholder{color:var(--muted)}
button.primary{font:inherit;font-weight:600;padding:0 22px;border:0;border-radius:14px;
  background:var(--accent);color:var(--accent-ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.add input:focus-visible{outline-offset:0}
.filters{display:flex;gap:6px;margin-bottom:14px}
.filters button{font:inherit;font-size:.9rem;padding:6px 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:18px;border:1px solid var(--line);overflow:hidden}
li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;cursor:pointer}
li label{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
li.done label{color:var(--done);text-decoration:line-through}
li .del{background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;padding:6px 8px;border-radius:8px}
li .del:hover{color:var(--danger)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.foot{margin-top:14px;text-align:right}
.foot button{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){
  li{animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Zadaci</h1>
      <p class="count">{{ summary }}</p>
    </div>
    <button class="theme" @click="toggleTheme" type="button">{{ dark ? 'Svijetla tema' : 'Tamna tema' }}</button>
  </header>

  <div class="add">
    <input v-model.trim="text" @keyup.enter="addTask" placeholder="Što treba napraviti?" aria-label="Novi zadatak" maxlength="120">
    <button class="primary" type="button" @click="addTask">Dodaj zadatak</button>
  </div>

  <div class="filters" role="group" aria-label="Filtar zadataka">
    <button v-for="f in filters" :key="f.id" type="button" :aria-pressed="filter === f.id" @click="filter = f.id">{{ f.label }}</button>
  </div>

  <ul v-if="visible.length">
    <li v-for="t in visible" :key="t.id" :class="{done: t.done}">
      <input type="checkbox" :id="'t'+t.id" v-model="t.done">
      <label :for="'t'+t.id">{{ t.title }}</label>
      <button class="del" type="button" @click="removeTask(t.id)" :aria-label="'Obriši zadatak: ' + t.title">Obriši</button>
    </li>
  </ul>
  <div v-else class="empty" style="background:var(--surface);border:1px solid var(--line);border-radius:18px">
    {{ tasks.length ? 'Nema zadataka u ovom filtru.' : 'Nema zadataka. Upiši prvi iznad i pritisni Enter.' }}
  </div>

  <div class="foot" v-if="doneCount">
    <button type="button" @click="clearDone">Ukloni završene ({{ doneCount }})</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, computed, watch } = Vue;

function load(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function save(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

createApp({
  setup(){
    const tasks = ref(load('zadaci:tasks', []));
    const text = ref('');
    const filter = ref('all');
    const filters = [
      { id:'all', label:'Svi' },
      { id:'active', label:'Aktivni' },
      { id:'done', label:'Završeni' }
    ];

    const prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = ref(load('zadaci:theme', prefersDark ? 'dark' : 'light'));
    const dark = computed(() => theme.value === 'dark');
    watch(theme, v => { document.documentElement.dataset.theme = v; save('zadaci:theme', v); }, { immediate:true });
    const toggleTheme = () => { theme.value = dark.value ? 'light' : 'dark'; };

    watch(tasks, v => save('zadaci:tasks', v), { deep:true });

    const doneCount = computed(() => tasks.value.filter(t => t.done).length);
    const activeCount = computed(() => tasks.value.length - doneCount.value);
    const visible = computed(() => tasks.value.filter(t =>
      filter.value === 'all' ? true : filter.value === 'done' ? t.done : !t.done));
    const summary = computed(() => tasks.value.length
      ? `Preostalo: ${activeCount.value} od ${tasks.value.length}`
      : 'Tvoj popis je prazan');

    function addTask(){
      if (!text.value) return;
      tasks.value.unshift({ id: Date.now(), title: text.value, done:false });
      text.value = '';
    }
    function removeTask(id){ tasks.value = tasks.value.filter(t => t.id !== id); }
    function clearDone(){ tasks.value = tasks.value.filter(t => !t.done); }

    return { tasks, text, filter, filters, dark, toggleTheme, doneCount, visible, summary, addTask, removeTask, clearDone };
  }
}).mount('#app');
</script>
</body>
</html>
