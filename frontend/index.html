<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekrani</title>
</head>
<body>
  <h1>Ekrani</h1>

  <h2>Svi ekrani</h2>
  <button onclick="ucitaj()">Osvježi popis</button>
  <ul id="lista"></ul>

  <h2>Dohvati ekran po ID-u</h2>
  <input id="id_ekrana" type="number" placeholder="ID">
  <button onclick="dohvatiJedan()">Dohvati</button>
  <p id="rezultat"></p>

  <h2>Dodaj novi ekran</h2>
  <input id="naziv" placeholder="Naziv ekrana">
  <button onclick="dodaj()">Dodaj</button>

  <h2>Podaci iz Pythona</h2>
  <h3>Katalog ekrana</h3>
  <ul id="p_ekrani"></ul>
  <h3>Recenzije</h3>
  <ul id="p_recenzije"></ul>
  <h3>Opcije dostave</h3>
  <ul id="p_dostava"></ul>

  <script>
    async function ucitaj() {
      const odgovor = await fetch('/ekrani');
      const ekrani = await odgovor.json();
      const lista = document.getElementById('lista');
      lista.innerHTML = '';
      ekrani.forEach(e => {
        const li = document.createElement('li');
        li.textContent = `${e.id}: ${e.naziv}`;
        lista.appendChild(li);
      });
    }

    async function dohvatiJedan() {
      const id = document.getElementById('id_ekrana').value;
      const odgovor = await fetch(`/ekrani/${id}`);
      const podatak = await odgovor.json();
      document.getElementById('rezultat').textContent =
        podatak.naziv ? `${podatak.id}: ${podatak.naziv}` : podatak.poruka;
    }

    async function dodaj() {
      const naziv = document.getElementById('naziv').value;
      await fetch('/ekrani', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ naziv })
      });
      document.getElementById('naziv').value = '';
      ucitaj();
    }

    function napuni(idLista, stavke, formatiraj){
      const lista = document.getElementById(idLista);
      lista.innerHTML = '';
      stavke.forEach(s=>{
        const li = document.createElement('li');
        li.textContent = formatiraj(s);
        lista.appendChild(li);
      });
    }

    async function ucitajPodatke(){
      const odgovor = await fetch('/podaci.json');
      const podaci = await odgovor.json();

      napuni('p_ekrani', podaci.ekrani,
        e => `${e.naziv} (${e.dijagonala}")-${e.cijena.toFixed(2)} eur`);
      napuni('p_recenzije', podaci.recenzije,
        r => `${r.korisnik} (${r.ocjena}/5): ${r.komentar}`);
      napuni('p_dostava', podaci.dostava,
        d => `${d.vrsta}, ${d.cijena.toFixed(2)} eur, ${d.dana} dana`);
    }

    ucitaj();
    ucitajPodatke();
  </script>
</body>
</html>
